<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRAVA COACH - DOMYOS BM 490</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --strava-orange: #FC6100; --strava-black: #121212; --strava-grey: #242428; }
        body { background-color: var(--strava-black); color: #FFFFFF; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .strava-card { background: var(--strava-grey); border-radius: 4px; padding: 20px; margin-bottom: 16px; border-bottom: 2px solid rgba(252, 97, 0, 0.2); width: 100%; box-sizing: border-box; }
        .text-strava { color: var(--strava-orange); }
        .bg-strava { background-color: var(--strava-orange); }
        .drawer { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-in-out; }
        .drawer-open { max-height: 3000px; padding-bottom: 20px; }
        .timer-font { font-variant-numeric: tabular-nums; font-weight: 900; }
        .btn-strava { background-color: var(--strava-orange); color: white; font-weight: 900; text-transform: uppercase; border-radius: 4px; width: 100%; transition: transform 0.1s; }
        .btn-strava:active { transform: scale(0.98); }
        input, select { background: #333337 !important; border: 1px solid #444448 !important; border-radius: 4px !important; color: white !important; width: 100% !important; box-sizing: border-box !important; padding: 1rem !important; }
    </style>
</head>
<body class="p-4 pb-32">

    <div class="flex justify-between items-center mb-8 px-1">
        <div>
            <h1 class="text-2xl font-black tracking-tighter uppercase italic leading-none text-strava">BM 490 <span class="text-white text-lg">EDITION</span></h1>
            <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mt-1 italic">Personal Training Dinámico</p>
        </div>
        <div class="flex gap-3">
            <button onclick="toggleDrawer('drawer-tanita')" class="text-xl">📊</button>
            <button onclick="toggleDrawer('equip-drawer')" class="text-xl">🛠️</button>
        </div>
    </div>

    <div id="mision-container" class="space-y-4 mb-10 w-full"></div>

    <div class="strava-card shadow-xl">
        <div class="flex justify-between items-start mb-6 gap-4">
            <div class="flex-1">
                <p class="text-[10px] font-black text-strava uppercase tracking-widest mb-1">Actividad</p>
                <div id="display" class="text-6xl timer-font italic leading-none">00:00</div>
                <div class="mt-4 flex items-center gap-2">
                    <span id="kcal-val" class="text-2xl font-black">0</span>
                    <p class="text-[10px] text-gray-500 uppercase font-bold">Kcal</p>
                </div>
            </div>
            <div class="text-right flex flex-col items-end">
                <p class="text-[10px] font-black text-strava uppercase tracking-widest mb-1">Polar H10</p>
                <div class="flex items-center gap-2">
                    <span id="bpm-val" class="text-5xl font-black">--</span>
                    <button onclick="connectPolar()" class="text-2xl">🧡</button>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <button onclick="toggleEntreno()" id="btn-start" class="btn-strava p-5 sm:col-span-2 text-sm">Iniciar</button>
            <button onclick="pausarEntreno()" id="btn-pause" class="bg-white/10 text-white p-5 rounded font-black text-xs uppercase italic border border-white/5">Pausa</button>
        </div>
    </div>

    <div id="drawer-tanita" class="drawer">
        <div class="strava-card bg-[#1a1a1e]">
            <p class="text-xs font-black text-strava uppercase mb-4 tracking-widest italic">Métricas Tanita</p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input type="number" id="tan-p" placeholder="PESO">
                <input type="number" id="tan-g" placeholder="% GRASA">
                <input type="number" id="tan-m" placeholder="% MUSC">
            </div>
            <button onclick="saveTanita()" class="w-full mt-4 bg-white text-black py-4 rounded font-black text-xs uppercase">Guardar</button>
        </div>
    </div>

    <div id="equip-drawer" class="drawer">
        <div class="strava-card bg-[#1a1a1e] mb-2">
            <p class="text-xs font-black text-gray-400 uppercase mb-4 italic">Inventario Discos</p>
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="number" id="dw" placeholder="Kg">
                <input type="number" id="dq" placeholder="Cant.">
            </div>
            <button onclick="addDisc()" class="w-full mt-3 bg-white/5 py-4 rounded text-xs font-black uppercase italic border border-white/10">Añadir Material</button>
            <div id="lista-discos" class="flex flex-wrap gap-2 mt-4"></div>
        </div>

        <div class="strava-card bg-[#1a1a1e]">
            <p class="text-xs font-black text-gray-400 uppercase mb-4 italic">Ejercicios BM 490</p>
            <input type="text" id="tn" placeholder="Nombre Ejercicio" class="mb-2">
            <div class="flex flex-col sm:flex-row gap-2 mb-4">
                <select id="tt">
                    <option value="bm490">Domyos BM 490</option>
                    <option value="calistenia">Calistenia</option>
                    <option value="cardio">Cardio</option>
                </select>
                <input type="number" id="tw" placeholder="Kg Base">
            </div>
            <button onclick="addTool()" class="btn-strava py-4 text-xs mb-4">Añadir a Memoria</button>
            <div id="lista-herramientas" class="space-y-2"></div>
        </div>
    </div>

    <script>
        // BASE DE DATOS ESPECÍFICA DOMYOS BM 490
        const BM490_DEFAULT = [
            { id: 'b1', n: 'Press de Banca (Barra)', t: 'bm490', w: 20, active: true },
            { id: 'b2', n: 'Butterfly (Pecho)', t: 'bm490', w: 10, active: true },
            { id: 'b3', n: 'Polea Alta Tríceps', t: 'bm490', w: 15, active: true },
            { id: 'b4', n: 'Jalón al Pecho (Polea)', t: 'bm490', w: 25, active: true },
            { id: 'b5', n: 'Extensión Cuádriceps', t: 'bm490', w: 15, active: true },
            { id: 'b6', n: 'Curl Femoral Tumbado', t: 'bm490', w: 10, active: true },
            { id: 'b7', n: 'Curl Bíceps (Pupitre)', t: 'bm490', w: 10, active: true },
            { id: 'b8', n: 'Remo Bajo (Polea)', t: 'bm490', w: 20, active: true },
            { id: 'b9', n: 'Press Militar (Barra)', t: 'bm490', w: 15, active: true },
            { id: 'c1', n: 'Flexiones', t: 'calistenia', w: 0, active: true },
            { id: 'c2', n: 'Abdominales Crunch', t: 'calistenia', w: 0, active: true }
        ];

        let myTools = JSON.parse(localStorage.getItem('myToolsV490')) || BM490_DEFAULT;
        let myDiscs = JSON.parse(localStorage.getItem('myDiscsV29')) || [];
        let bodyComp = JSON.parse(localStorage.getItem('bodyComp')) || { peso: 75, grasa: 20, musculo: 35 };
        let intensityFactor = parseFloat(localStorage.getItem('intensityFactor')) || 1.0;
        
        let seg=0, crono=null, running=false, pausado=false, currentBPM=0, totalKcal=0;

        // FUNCIONES DE MOTOR DINÁMICO
        function getCapacidadMaxima() { return myDiscs.reduce((acc, d) => acc + (parseFloat(d.w) * parseInt(d.q)), 0); }

        function calcularPlan(tool) {
            const maxFisico = getCapacidadMaxima();
            let repsExtra = 0, pesoFinal = tool.w;

            if (tool.t === 'bm490' && tool.w > 0) {
                if (tool.w > maxFisico) { pesoFinal = maxFisico; repsExtra = Math.round((tool.w - maxFisico) * 0.7); }
                let finalReps = Math.round((10 + repsExtra) / intensityFactor);
                return { reps: `${finalReps} reps`, carga: `${pesoFinal}kg` };
            }
            if (tool.t === 'calistenia') {
                let r = Math.round((12 + (bodyComp.musculo/10) - (bodyComp.grasa/5)) / intensityFactor);
                return { reps: `${r} reps`, carga: "Peso Corporal" };
            }
            return { reps: "20 min", carga: "Z2" };
        }

        function generarMision() {
            const cont = document.getElementById('mision-container');
            let pool = myTools.filter(t => t.active);
            if (pool.length === 0) { cont.innerHTML = "<p class='text-center py-4 opacity-50 uppercase text-[10px] font-black'>Sin ejercicios activos</p>"; return; }
            
            let html = '';
            [...pool].sort(() => 0.5 - Math.random()).slice(0, 3).forEach(t => {
                const plan = calcularPlan(t);
                html += `
                    <div class="strava-card py-4 flex justify-between items-center border-l-4 border-strava bg-[#1a1a1e]">
                        <div>
                            <span class="text-[8px] bg-strava px-2 py-0.5 rounded font-black uppercase mb-1 inline-block">BM 490</span>
                            <h3 class="font-black text-sm uppercase italic">${t.n}</h3>
                            <p class="text-[10px] text-gray-500 font-bold uppercase italic">${plan.carga}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-black italic text-strava">${plan.reps}</p>
                            <p class="text-[8px] text-gray-600 font-black uppercase tracking-tighter">Objetivo</p>
                        </div>
                    </div>`;
            });
            cont.innerHTML = html;
        }

        // GESTIÓN DE INTERFAZ Y DATOS
        function toggleDrawer(id) { document.getElementById(id).classList.toggle('drawer-open'); }

        function renderTools() {
            const cont = document.getElementById('lista-herramientas'); cont.innerHTML = '';
            myTools.forEach(t => {
                cont.innerHTML += `
                    <div class="flex justify-between items-center bg-white/5 p-4 rounded border border-white/5">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${t.active?'checked':''} onchange="toggleStatus('${t.id}')" class="w-4 h-4 accent-strava">
                            <span class="text-[11px] font-black uppercase italic">${t.n}</span>
                        </div>
                        <button onclick="deleteTool('${t.id}')" class="text-strava font-bold px-2">✕</button>
                    </div>`;
            });
        }

        function toggleStatus(id) {
            let t = myTools.find(x => x.id === id);
            if(t) { t.active = !t.active; localStorage.setItem('myToolsV490', JSON.stringify(myTools)); generarMision(); }
        }

        function deleteTool(id) {
            myTools = myTools.filter(x => x.id !== id);
            localStorage.setItem('myToolsV490', JSON.stringify(myTools)); renderTools(); generarMision();
        }

        function addTool() {
            const n = document.getElementById('tn').value;
            const t = document.getElementById('tt').value;
            const w = parseFloat(document.getElementById('tw').value) || 0;
            if(n) {
                myTools.push({id: 'u'+Date.now(), n, t, w, active: true});
                localStorage.setItem('myToolsV490', JSON.stringify(myTools));
                document.getElementById('tn').value = ''; renderTools(); generarMision();
            }
        }

        function addDisc() {
            const w = parseFloat(document.getElementById('dw').value);
            const q = parseInt(document.getElementById('dq').value);
            if(w && q) {
                myDiscs.push({w, q});
                localStorage.setItem('myDiscsV29', JSON.stringify(myDiscs));
                document.getElementById('dw').value = ''; document.getElementById('dq').value = '';
                renderDiscs(); generarMision();
            }
        }

        function renderDiscs() {
            const cont = document.getElementById('lista-discos'); cont.innerHTML = '';
            myDiscs.forEach((d, i) => {
                cont.innerHTML += `<div class="bg-strava/10 border border-strava/20 px-3 py-2 rounded text-[10px] font-black uppercase flex gap-2 items-center italic">${d.q}x ${d.w}kg <button onclick="removeDisc(${i})" class="text-strava">✕</button></div>`;
            });
        }

        function removeDisc(i) { myDiscs.splice(i, 1); localStorage.setItem('myDiscsV29', JSON.stringify(myDiscs)); renderDiscs(); generarMision(); }

        function toggleEntreno() {
            if(!running) {
                running = true; seg = 0; totalKcal = 0;
                document.getElementById('btn-start').innerText = "FINALIZAR";
                crono = setInterval(() => { if(!pausado) { seg++; updateDisp(); } }, 1000);
            } else {
                clearInterval(crono); running = false;
                let f = prompt("Esfuerzo (0.8:Bajo, 1.0:Optimo, 1.3:Máximo)", "1.0");
                if(f) { localStorage.setItem('intensityFactor', f); location.reload(); }
            }
        }

        function pausarEntreno() { pausado = !pausado; document.getElementById('btn-pause').innerText = pausado ? "REANUDAR" : "PAUSA"; }
        function updateDisp() { let m=Math.floor(seg/60), s=seg%60; document.getElementById('display').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
        function saveTanita() {
            bodyComp.peso = parseFloat(document.getElementById('tan-p').value) || bodyComp.peso;
            bodyComp.grasa = parseFloat(document.getElementById('tan-g').value) || bodyComp.grasa;
            bodyComp.musculo = parseFloat(document.getElementById('tan-m').value) || bodyComp.musculo;
            localStorage.setItem('bodyComp', JSON.stringify(bodyComp)); toggleDrawer('drawer-tanita'); generarMision();
        }

        window.onload = () => { 
            document.getElementById('tan-p').value = bodyComp.peso;
            document.getElementById('tan-g').value = bodyComp.grasa;
            document.getElementById('tan-m').value = bodyComp.musculo;
            renderDiscs(); renderTools(); generarMision(); 
        };
    </script>
</body>
</html>
